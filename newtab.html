<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="pageTitleNewtab">书签卡片 · 新标签页</title>
    <link rel="icon" href="icons/icon48.png">
    <script src="scripts/theme-init.js"></script>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/newtab.css">
  </head>
  <body class="page-newtab">
    <header class="topbar">
      <div class="topbar__inner">
        <button class="brand" id="brandBtn" type="button" data-i18n-title="brandTitle" title="回到全部书签">
          <img class="brand__logo" src="icons/icon48.png" alt="">
          <span class="brand__name" data-i18n="brandName">书签卡片</span>
        </button>

        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.4-3.4"></path>
          </svg>
          <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="searchLabel" placeholder="搜索书签，回车搜索网页" autocomplete="off" spellcheck="false" aria-label="搜索书签">
          <kbd class="search__kbd">/</kbd>
        </div>

        <div class="topbar__actions">
          <button class="icon-btn" id="refreshBtn" type="button" data-i18n-title="refresh" data-i18n-aria-label="refresh" title="刷新书签" aria-label="刷新书签"></button>
          <button class="icon-btn" id="viewBtn" type="button" title="切换视图" aria-label="切换视图"></button>
          <button class="icon-btn" id="themeBtn" type="button" title="切换主题" aria-label="切换主题"></button>
          <button class="icon-btn" id="settingsBtn" type="button" data-i18n-title="settings" data-i18n-aria-label="settingsAria" title="设置" aria-label="打开设置"></button>
          <a class="tool-btn tool-btn--promo" href="https://i.eatmango.cn/" target="_blank" rel="noopener noreferrer"
             data-i18n-title="moreAppsTitle" title="更多应用 · 在新标签页打开">
            <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 8 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16Zm0-1c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15Z"/></svg>
            <span data-i18n="moreApps">更多应用</span>
          </a>
        </div>
      </div>
    </header>

    <div class="shell">
      <div class="tabbar">
        <nav class="tabs" id="tabs" role="tablist" aria-label="书签文件夹" data-i18n-aria-label="tabsLabel"></nav>
        <button class="tool-btn" id="expandBtn" type="button" aria-pressed="false"></button>
      </div>
      <div class="crumb" id="crumb" hidden></div>

      <main class="content">
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden>
          <div class="empty__icon" id="emptyIcon"></div>
          <h2 class="empty__title" id="emptyTitle"></h2>
          <p class="empty__text" id="emptyText"></p>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="scripts/shared.js"></script>
    <script src="scripts/newtab.js"></script>
  </body>
</html>
